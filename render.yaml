# Render Blueprint — Django Enterprise Starter Template
# Database = Neon (PostgreSQL 16+):
#   1. Create a project on Neon, open the Connection Details and copy the
#      "Pooled" connection string (ends with ?sslmode=require).
#   2. In Render (Dashboard → your service → Environment), set:
#        DATABASE_URL = <the Neon pooled connection string>
#   (If you prefer Render-managed PostgreSQL instead, add a `databases:`
#    block — Render then injects DATABASE_URL automatically.)

services:
  - type: web
    name: django-enterprise
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --config gunicorn.conf.py"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
