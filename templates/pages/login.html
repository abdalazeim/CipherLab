{% load static %}<!DOCTYPE html>
<html lang="{{ html_lang }}" dir="{{ html_dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_title }} - {{ site_subtitle }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/cairo/cairo.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/tajawal/tajawal.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: '{{ app_font_family }}', 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F3D4C 0%, #174A5A 50%, #1C5A6B 100%);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.1) 0%, transparent 50%);
      animation: pulse 15s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-header {
      background: linear-gradient(135deg, #0F3D4C, #174A5A);
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.15) 0%, transparent 50%);
    }
    .login-logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #D4A373, #C4956A);
      border-radius: 20px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(212,163,115,0.4);
      position: relative;
      z-index: 1;
    }
    .login-logo i { font-size: 36px; color: #fff; }
    .login-header h1 {
      color: #fff; font-size: 24px; font-weight: 800;
      margin-bottom: 5px; position: relative; z-index: 1;
    }
    .login-header p {
      color: rgba(255,255,255,0.8); font-size: 14px; position: relative; z-index: 1;
    }
    .login-body { padding: 35px 30px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; margin-bottom: 8px; font-weight: 600;
      color: #0F3D4C; font-size: 14px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper i {
      position: absolute; right: 15px; top: 50%;
      transform: translateY(-50%); color: #0F3D4C; font-size: 16px; opacity: 0.6;
    }
    .form-control {
      width: 100%; padding: 14px 45px 14px 15px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 15px; font-family: '{{ app_font_family }}', 'Cairo', sans-serif;
      transition: all 0.3s ease; background: #f8fafc;
    }
    .form-control:focus {
      outline: none; border-color: #0F3D4C; background: #fff;
      box-shadow: 0 0 0 4px rgba(15,61,76,0.1);
    }
    .btn-login {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #0F3D4C, #174A5A);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: '{{ app_font_family }}', 'Cairo', sans-serif;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #174A5A, #1C5A6B);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(15,61,76,0.3);
    }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-login .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert {
      padding: 14px 18px; border-radius: 10px; margin-bottom: 20px;
      display: none; align-items: center; gap: 10px; font-size: 14px;
      animation: shake 0.5s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; }
    .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #059669; }
    .alert i { font-size: 18px; }
    .login-footer { text-align: center; padding: 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    .login-footer p { color: #64748b; font-size: 12px; }
    .login-footer strong { color: #0F3D4C; }
    .password-toggle {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%); color: #64748b;
      cursor: pointer; padding: 5px; transition: color 0.3s;
    }
    .password-toggle:hover { color: #0F3D4C; }
  </style>
  <link rel="stylesheet" href="{% static 'css/brand.css' %}?v=1">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-microchip"></i>
        </div>
        <h1>{{ site_title }}</h1>
        <p>{{ site_subtitle }}</p>
      </div>
      <div class="login-body">
        <div class="alert alert-error" id="errorAlert">
          <i class="fas fa-circle-exclamation"></i>
          <span id="errorMessage">بيانات تسجيل الدخول غير صحيحة</span>
        </div>
        <div class="alert alert-success" id="successAlert">
          <i class="fas fa-check-circle"></i>
          <span id="successMessage">تم تسجيل الدخول بنجاح</span>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label"><i class="fas fa-user me-1"></i> اسم المستخدم</label>
            <div class="input-wrapper">
              <input type="text" class="form-control" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
              <i class="fas fa-user-circle"></i>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fas fa-lock me-1"></i> كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
              <i class="fas fa-key"></i>
              <span class="password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye" id="toggleIcon"></i>
              </span>
            </div>
          </div>
          <button type="submit" class="btn-login" id="loginBtn">
            <span id="loginText"><i class="fas fa-sign-in-alt me-2"></i> تسجيل الدخول</span>
            <div class="spinner" id="loginSpinner" style="display: none;"></div>
          </button>
        </form>
      </div>
      <div class="login-footer">
        <p><i class="fas fa-microchip me-1" style="color: #D4A373;"></i> <strong>{{ site_title }}</strong> - جميع الحقوق محفوظة © 2026</p>
        <p style="margin-top:8px;">
          {% if html_lang == 'ar' %}
          <a href="?lang=en" style="color:#0F3D4C;font-weight:700;text-decoration:none;">English</a>
          {% else %}
          <a href="?lang=ar" style="color:#0F3D4C;font-weight:700;text-decoration:none;">العربية</a>
          {% endif %}
        </p>
      </div>
    </div>
  </div>
  <script>
    function togglePassword() {
      const p = document.getElementById('password');
      const i = document.getElementById('toggleIcon');
      if (p.type === 'password') { p.type = 'text'; i.classList.replace('fa-eye', 'fa-eye-slash'); }
      else { p.type = 'password'; i.classList.replace('fa-eye-slash', 'fa-eye'); }
    }
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const text = document.getElementById('loginText');
      const spinner = document.getElementById('loginSpinner');
      const errAlert = document.getElementById('errorAlert');
      const sucAlert = document.getElementById('successAlert');
      errAlert.style.display = 'none'; sucAlert.style.display = 'none';
      btn.disabled = true; text.innerHTML = '<span>جاري التحقق...</span>'; spinner.style.display = 'block';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          sucAlert.style.display = 'flex';
          document.getElementById('successMessage').textContent = data.message;
          setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
          errAlert.style.display = 'flex';
          document.getElementById('errorMessage').textContent = data.error;
        }
      } catch (error) {
        errAlert.style.display = 'flex';
        document.getElementById('errorMessage').textContent = 'حدث خطأ في الاتصال بالخادم';
      } finally {
        btn.disabled = false;
        text.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>تسجيل الدخول';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
