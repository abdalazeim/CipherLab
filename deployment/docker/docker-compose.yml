# ==============================================================================
# docker-compose.yml — Django Enterprise Starter Template (Development)
# Run from deployment/docker/ directory: docker compose up --build
# Source code is mounted from project root (../..) via volume.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: enterprise_dev
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - enterprise_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: enterprise-django:latest
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: django-insecure-dev-key-do-not-use-in-production
      DEBUG: "True"
      DATABASE_URL: postgresql://enterprise:enterprise@db:5432/enterprise_dev
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,*"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_SSL_REDIRECT: "False"
      RATE_LIMIT_LOGIN: "30/m"
      RATE_LIMIT_API: "120/m"
    volumes:
      - ../..:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - enterprise_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@enterprise.local
      PGADMIN_DEFAULT_PASSWORD: enterprise_admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5051:80"
    depends_on:
      - db
    profiles:
      - pgadmin
    networks:
      - enterprise_network

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  django_logs:
  pgadmin_data:

networks:
  enterprise_network:
    driver: bridge
