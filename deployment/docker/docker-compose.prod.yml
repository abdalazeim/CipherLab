# ==============================================================================
# docker-compose.prod.yml — General Development System (GDS) (Production)
# Build from PROJECT ROOT:
#   docker compose -f deployment/docker/docker-compose.prod.yml up -d
# ==============================================================================
# NOTE: Run from the PROJECT ROOT. Dockerfile.prod bakes the source into the
# image (no volume mount). SSL certificates are expected on the host and are
# NOT mounted here — adjust the nginx service if needed.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: gds_prod
      POSTGRES_USER: gds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gds}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gds -d gds_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gds_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gds_network

  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.prod
    image: gds-django:prod
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DATABASE_URL: postgresql://gds:${POSTGRES_PASSWORD:-gds}@db:5432/gds_prod
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "31536000"
      RATE_LIMIT_LOGIN: "10/m"
      RATE_LIMIT_API: "60/m"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gds_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
    networks:
      - gds_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gds.local
      PGADMIN_DEFAULT_PASSWORD: gds_admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5051:80"
    depends_on:
      - db
    profiles:
      - never
    networks:
      - gds_network

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  django_logs:
  pgadmin_data:

networks:
  gds_network:
    driver: bridge
